<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宏全集團 AI 推動管理系統</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-badge">AI</div>
        <div class="sidebar-logo-text">
          <div class="logo-title">宏全集團</div>
          <div class="logo-sub">AI 推動管理系統</div>
        </div>
        <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="收起選單" aria-label="收起選單"></button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" onclick="navigate('dashboard')" title="集團總覽">
          <span class="nav-icon">📊</span><span class="nav-label">集團總覽</span>
        </a>
        <a class="nav-item" data-page="plan" onclick="navigate('plan')" title="導入計畫">
          <span class="nav-icon">🗺️</span><span class="nav-label">導入計畫</span>
        </a>
        <a class="nav-item" data-page="units" onclick="navigate('units')" title="單位追蹤">
          <span class="nav-icon">🏭</span><span class="nav-label">單位追蹤</span>
        </a>
        <a class="nav-item" data-page="requirements" onclick="navigate('requirements')" title="需求管理">
          <span class="nav-icon">🔍</span><span class="nav-label">需求管理</span>
        </a>
        <a class="nav-item" data-page="cases" onclick="navigate('cases')" title="AI 應用案例">
          <span class="nav-icon">💡</span><span class="nav-label">AI 應用案例</span>
        </a>
        <a class="nav-item" data-page="talent" onclick="navigate('talent')" title="AI 人才網路">
          <span class="nav-icon">👥</span><span class="nav-label">AI 人才網路</span>
        </a>
        <a class="nav-item" data-page="training" onclick="navigate('training')" title="課程安排">
          <span class="nav-icon">🎓</span><span class="nav-label">課程安排</span>
        </a>
        <div class="nav-divider"></div>
        <a class="nav-item" data-page="api" onclick="navigate('api')" title="API 用量">
          <span class="nav-icon">💳</span><span class="nav-label">API 用量</span>
        </a>
        <a class="nav-item" data-page="changelog" onclick="navigate('changelog')" title="修改記錄">
          <span class="nav-icon">📋</span><span class="nav-label">修改記錄</span>
        </a>
      </nav>
      <div class="sidebar-footer">v2.8.3 · 資料來源：Google Sheets</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" onclick="toggleSidebar()" aria-label="開啟選單">
            <span></span><span></span><span></span>
          </button>
          <h1 class="page-title" id="page-title">集團總覽</h1>
        </div>
        <div class="topbar-right">
          <span class="update-badge" id="update-date">資料更新：—</span>
        </div>
      </header>
      <div class="content" id="content"></div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
